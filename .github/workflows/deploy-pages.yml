# Publishes the A5 beta at the site root and /v0.5/, with earlier builds at /v0.3/ and /v0.4/.
# One-time setup: repository Settings → Pages → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Install Chromium for UI regression checks
        run: npx playwright install --with-deps chromium
      - name: Check Explore and environment regressions
        run: npx playwright test --grep-invert "feeding challenge:|population slider"
      - run: npm run build
      - name: Preserve the current A5 build at /v0.5/
        run: |
          cp -a dist "$RUNNER_TEMP/aquaswarm-a5-dist"
          mkdir -p dist/v0.5
          cp -a "$RUNNER_TEMP/aquaswarm-a5-dist/." dist/v0.5/
      - name: Build earlier assignment releases into dist/v0.3 and dist/v0.4
        run: |
          for version in 0.3 0.4; do
            release="$RUNNER_TEMP/aquaswarm-$version"
            ref="refs/tags/v$version.0"
            # The final A4 body-contact fixes followed the original v0.4.0 tag.
            if [ "$version" = "0.4" ]; then
              ref="c9d03bc210550aefb0cf3c85ac58d615a0ed9cd4"
            fi
            git worktree add --detach "$release" "$ref"
            (cd "$release" && npm ci && npm run build -- --outDir "$GITHUB_WORKSPACE/dist/v$version" --emptyOutDir)
          done
      - name: Verify the versioned entry points
        run: |
          for version in 0.3 0.4 0.5; do
            test -s "dist/v$version/index.html"
            test -d "dist/v$version/assets"
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
